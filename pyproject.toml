[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostworktree"
version = "0.1.0"
description = "Isolated git worktree, port, and env-copy manager per agent task: one tree, one branch, one local port, seeded only from .env.example"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["git", "worktree", "agents", "isolation", "ghostslice"]
dependencies = []

[project.scripts]
ghostworktree = "ghostworktree.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
